# ---------------------------------------------------------------------
# connection.conf - how the numbered scripts connect to the database.
# Edit this once. A variable already set in your environment wins over
# the value here (e.g.  DBA_CONTAINER=PDB2 ./1_build.sh).
# Passwords are never stored here: the scripts ask for them, or take
# them from PINX_PASSWORD / DBA_PASSWORD in the environment.
# ---------------------------------------------------------------------

# Service of the PDB that holds the test user PINX, as host:port/service.
: "${PINX_SERVICE:=//localhost:1521/pdb1.world}"

# How to connect as a DBA. Used by 1_build.sh (create the user) and
# 5_cleanup.sh (drop it).
#   '/ as sysdba'                    on the database host, OS authentication;
#                                    set DBA_CONTAINER to the PDB
#   'system@//dbhost:1521/pdb1'      from anywhere; you are asked for the
#                                    password; leave DBA_CONTAINER empty
#   'sys@//dbhost:1521/pdb1 as sysdba'   likewise
: "${DBA_CONNECT:=/ as sysdba}"

# PDB to switch to after the DBA login (needed when that login lands in
# CDB$ROOT, as '/ as sysdba' does). Empty = stay where the login lands.
: "${DBA_CONTAINER:=PDB1}"

# Optional: a complete connect string for PINX that needs no password,
# e.g. '/@pinx_wallet' with an Oracle wallet. Overrides PINX_SERVICE.
: "${PINX_CONNECT:=}"

# SQL client: 'sql' (SQLcl) or 'sqlplus'. Empty = SQLcl if it is on
# PATH, otherwise SQL*Plus.
: "${PINX_CLIENT:=}"
